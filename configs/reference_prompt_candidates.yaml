- id: medium_cache_regression
  length_class: medium
  exact_token_count: 310
  text_sha256: 435708c34bf125b9a8aa8980b21969d30d8524db7a86b61d16737db64c825062
  text: |
    Investigate this Python cache regression and propose the smallest safe patch.
    Do not change public signatures, do not disable validation, and preserve batch-one semantics.

    ```python
    class SessionCache:
        def __init__(self):
            self.items = {}

        def put(self, key, value, generation):
            self.items[key] = (generation, value)

        def get(self, key, generation):
            stored_generation, value = self.items[key]
            if stored_generation <= generation:
                return value
            raise KeyError(key)
    ```

    The failing suite is deterministic. Relevant observations follow.
    case 01: key='worker-1', requested_generation=1, stored_generation=0, expected='miss', actual='hit'
    case 02: key='worker-2', requested_generation=2, stored_generation=1, expected='miss', actual='hit'
    case 03: key='worker-3', requested_generation=3, stored_generation=2, expected='miss', actual='hit'
    case 04: key='worker-0', requested_generation=4, stored_generation=3, expected='miss', actual='hit'
    case 05: key='worker-1', requested_generation=5, stored_generation=4, expected='miss', actual='hit'
    case 06: key='worker-2', requested_generation=6, stored_generation=5, expected='miss', actual='hit'
